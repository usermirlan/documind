# Local stack: docker compose up --build  →  http://localhost:3200
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 3s
      retries: 20
    ports: ["5434:5432"]

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://documind:documind@db:5432/documind
      CORS_ORIGINS: http://localhost:3200
      EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8200:8000"]
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ["3200:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
